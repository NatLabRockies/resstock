schema_version: '0.7'
os_version: 3.9.0
os_sha: c77fbb9569
# Use the project-built apptainer image that ships with OCHRE pre-installed
# at /opt/OCHRE/.venv/bin/ochre. Built by apptainer/build-ochre-image.sh.
sys_image_dir: /projects/panels/bsb_ochre/apptainer_images
buildstock_directory: ../ # Relative to this file or absolute
project_directory: project_national # Relative to buildstock_directory
output_directory: /projects/panels/bsb_ochre/sdr2025_r1_oct27_10k_idealnofrost/
#output_directory: /projects/panels/bsb_ochre/precomputed_eplus_july30/
weather_files_path: /kfs2/shared-projects/buildstock/weather/BuildStock_2018_FIPS.zip
# weather_files_url: https://data.nrel.gov/system/files/156/Buildstock_TMY3_FIPS-1678817889.zip
# weather_files_path: ../weather # Local weather files example
# weather_files_path: /kfs2/shared-projects/buildstock/weather/BuildStock_TMY3_FIPS.zip # Kestrel TMY3 weather files
# weather_files_path: /kfs2/shared-projects/buildstock/weather/BuildStock_2018_FIPS.zip # Kestrel 2018 weather files

# Baseline number of units
baseline:
  n_buildings_represented: 139647020 # 2539036 # 139647020 * 10K/550K # American Community Survey 2021 5-year, B25001, does not include territories ( 138765649 without AK and HI )

# Sampler type and number of data points per baseline or upgrade
sampler:
  # type: precomputed
  type: precomputed # For production run
  args:
    #sample_file: res_sdr_2025_r1.csv
    sample_file: buildstock_test_10k.csv
    # n_datapoints: 10000 # For production run
# NREL High Performance Computing machine configuration
# Not used if running buildstock_local (local tests and CI)
kestrel:
  n_jobs: 20
  # minutes_per_sim is optional; auto-sized from stock type + use_ochre.
  account: panels
  postprocessing:
    time: 240
    n_workers: 20
    n_procs: 20
  sampling:
    time: 20

# Post proccessing and Amazon Web Services
postprocessing:
  # Post simulation partitioning
  keep_individual_timeseries: true
  partition_columns:
    - State
    - County
  # AWS upload bucket and athena setup (uncomment during production and testing runs)
  publish_annual_results: true
  aws:
   region_name: us-west-2
   s3:
     bucket: resstock-panels
     prefix: ochre_runs
   athena:
     glue_service_role: service-role/AWSGlueServiceRole-default
     database_name: resstock_panels
     max_crawling_time: 1200

# Workflow generator
workflow_generator:
  # ResStock HPXML workflow generator
  type: residential_hpxml
  version: 2026.01.12
  args:
    # Annual simulation and timestep
    use_ochre: true

    # OCHRE simulates at simulation_control_timestep (1 min) but writes the
    # timeseries at output_res_minutes to keep output size manageable. Annual
    # totals are still computed from the full-resolution data.
    ochre:
      output_res_minutes: 15
      # DEFCO frost/defrost mode: Standard (default), Time, or IdealNoFrost (no frost
      # growth or defrost; compressor low-temperature lockout retained). Needs the
      # --defco_mode CLI option added to OCHRE on 2026-10-27.
      defco_mode: IdealNoFrost

    build_existing_model:
      # simulation_control_timestep: 15  # 15-min used for the oct19 10k speed test; defrost fraction and peaks need 1-min
      simulation_control_timestep: 1
      simulation_control_run_period_begin_month: 1
      simulation_control_run_period_begin_day_of_month: 1
      simulation_control_run_period_end_month: 12
      simulation_control_run_period_end_day_of_month: 31
      simulation_control_run_period_calendar_year: 2018

    # Emissions scenarios
    emissions:
      - scenario_name: LRMER_MidCase_15
        type: CO2e
        elec_folder: data/emissions/cambium/2024/LRMER_MidCase_15

    # Utility bill rates
    utility_bills:
      - scenario_name: Bills

    # Outputs to include
    simulation_output_report:
      timeseries_frequency: hourly
      # timeseries_frequency: timestep
      include_timeseries_total_consumptions: true
      include_timeseries_fuel_consumptions: true
      include_timeseries_end_use_consumptions: true
      include_timeseries_emissions: true
      include_timeseries_emission_fuels: true
      include_timeseries_emission_end_uses: true
      include_timeseries_hot_water_uses: true
      include_timeseries_total_loads: true
      include_timeseries_component_loads: false
      include_timeseries_unmet_hours: true
      include_timeseries_zone_temperatures: true
      include_timeseries_zone_conditions: true
      include_timeseries_airflows: true
      include_timeseries_weather: true
      include_timeseries_resilience: true

    # Other reporting measures to run
    reporting_measures:
      - measure_dir_name: QOIReport

    # Files to keep
    server_directory_cleanup:
      retain_schedules_csv: true
